<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蒲公英采集助手测试页</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    main {
      max-width: 1040px;
      margin: 40px auto;
      padding: 0 24px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 18px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      padding: 14px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    select,
    button {
      height: 34px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      padding: 0 10px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }
    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef0f3;
      text-align: left;
      font-size: 14px;
    }
    th {
      color: #6b7280;
      font-weight: 600;
      background: #fafafa;
    }
    .name {
      font-weight: 700;
    }
    .ant-pagination-next {
      margin-top: 16px;
      background: #e11d48;
      color: #fff;
      border-color: #e11d48;
    }
    .ant-pagination-next.disabled {
      background: #e5e7eb;
      color: #9ca3af;
      border-color: #e5e7eb;
    }
  </style>
</head>
<body>
  <main>
    <h1>模拟蒲公英达人列表</h1>
    <div class="toolbar">
      <span>筛选类目</span>
      <select>
        <option>运动健身</option>
        <option>美食</option>
      </select>
      <span>这只是本地模拟页，用于验证采集面板和导出。</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>达人</th>
          <th>样例笔记</th>
          <th>粉丝</th>
          <th>报价</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <button class="ant-pagination-next" id="nextBtn" type="button">下一页</button>
  </main>
  <script>
    const pages = [
      [
        ["北海浪人", "603ef9e800000000100122f", "36.6w", "¥48,999"],
        ["健身小妮", "5d10a107000000001001da15", "11.8w", "¥29,000"],
        ["ssmaimai", "57c0854582ec393a14557d19", "13.1w", "¥24,000"]
      ],
      [
        ["高原跑者", "5c73d65b000000001000c91f", "514.7w", "¥101,000"],
        ["城市瑜伽笔记", "65aa0cce000000000102abcd", "9.7w", "¥18,000"],
        ["户外装备测评", "65aa0cef000000000102abce", "21.3w", "¥36,000"]
      ]
    ];
    let page = 0;
    const rows = document.querySelector("#rows");
    const nextBtn = document.querySelector("#nextBtn");

    function renderRows() {
      rows.innerHTML = "";
      for (const item of pages[page]) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a class="name" href="https://pgy.xiaohongshu.com/solar/pre-trade/blogger-detail/${item[1]}?track_id=test">${item[0]}</a></td>
          <td>近期内容缩略图</td>
          <td>${item[2]}</td>
          <td>${item[3]}</td>
          <td><a href="https://pgy.xiaohongshu.com/solar/pre-trade/blogger-detail/${item[1]}?track_id=test">查看详情</a></td>
        `;
        rows.appendChild(tr);
      }
      nextBtn.classList.toggle("disabled", page >= pages.length - 1);
      nextBtn.setAttribute("aria-disabled", page >= pages.length - 1 ? "true" : "false");
    }

    nextBtn.addEventListener("click", () => {
      if (page >= pages.length - 1) return;
      page += 1;
      setTimeout(renderRows, 500);
    });
    renderRows();
  </script>
</body>
</html>
